    function applyTextStyle(prop, value) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'group') {
            activeObj.getObjects().forEach(child => {
                if (child.type === 'text') {
                    child.set(prop, value);

            });

            saveData();
        } else {
            // Сохраняем стиль для новых объектов
            if (prop === 'fontFamily') textStyles.fontFamily = value;

            else if (prop === 'fill') textStyles.fill = value;

    function toggleTextStyle(prop, value) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'group') {
            activeObj.getObjects().forEach(child => {
                if (child.type === 'text') {
                    const current = child.get(prop);
                    const newVal = (current === value || current === true) ? 
                        (prop === 'fontWeight' ? 'normal' : 
                         prop === 'fontStyle' ? 'normal' : false) : value;
                    child.set(prop, newVal);

                    updateTextButtons(child);

            });

            } else if (prop === 'fontStyle') {
                textStyles.fontStyle = textStyles.fontStyle === 'italic' ? 'normal' : 'italic';

            } else if (prop === 'linethrough') {
                textStyles.linethrough = !textStyles.linethrough;
            }
        }

        document.getElementById('underlineBtn').classList.toggle('active', textObj.underline === true);

    function addShapeToCanvas() {
        const centerX = canvas.width / 2 + (Math.random() - 0.5) * 120;
        const centerY = canvas.height / 2 + (Math.random() - 0.5) * 80;

        const taskText = prompt('Введите задачу:', 'Новая задача');
        if (taskText === null) return;
        const text = taskText.trim() || 'Задача';

        const group = createShape(currentShape, centerX, centerY, text);
        const taskId = nextId++;

        group.taskId = taskId;
        group.comment = '';
        group.done = false;

        group.on('mousedown', () => onShapeClick(taskId));

        canvas.add(group);
        canvas.setActiveObject(group);
        canvas.renderAll();

        tasks.push({
            id: taskId,
            text: text,
            shape: currentShape,
            done: false,
            comment: '',
            color: currentColor,
        });

        saveData();
        renderTasks();
    }

    // ============================================================
    // 6. КЛИК ПО ФИГУРЕ
    // ============================================================
    function onShapeClick(taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;

        if (window.shiftKey) {
            selectedTaskId = taskId;
            document.getElementById('commentInput').value = task.comment || '';
            document.getElementById('commentModal').classList.add('show');
            return;
        }

        task.done = !task.done;

        const obj = canvas.getObjects().find(o => o.taskId === taskId);
        if (obj) {
            obj.done = task.done;
            obj.getObjects().forEach(child => {
                if (child.type === 'rect' || child.type === 'circle' || 
                    child.type === 'polygon' || child.type === 'path') {
                    child.set({ opacity: task.done ? 0.4 : 1 });
                }
            });
            canvas.renderAll();
        }

        saveData();
        renderTasks();
    }

    // ============================================================
    // 7. КОММЕНТАРИИ

    function closeCommentModal() {
        document.getElementById('commentModal').classList.remove('show');
        selectedTaskId = null;
    }

    function saveComment() {
        if (selectedTaskId === null) return;
        const text = document.getElementById('commentInput').value;
        const task = tasks.find(t => t.id === selectedTaskId);
        if (task) {
            task.comment = text;
            const obj = canvas.getObjects().find(o => o.taskId === selectedTaskId);
            if (obj) obj.comment = text;
            saveData();
            renderTasks();
        }
        closeCommentModal();
    }

    document.getElementById('commentModal').addEventListener('click', function(e) {
